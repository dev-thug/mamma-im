<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="월령별 분유량을 재는 젖병 일러스트">
  <rect width="1200" height="630" rx="32" fill="#FFF1F2"/>
  <circle cx="150" cy="110" r="70" fill="#FFE4E6"/>
  <circle cx="1060" cy="520" r="90" fill="#FFE4E6"/>
  <circle cx="1010" cy="120" r="26" fill="#FECDD3"/>
  <circle cx="180" cy="520" r="20" fill="#FECDD3"/>
  <!-- bottle body -->
  <rect x="520" y="170" width="160" height="330" rx="48" fill="#FFFFFF" stroke="#FF4757" stroke-width="10"/>
  <!-- milk -->
  <rect x="540" y="300" width="120" height="180" rx="30" fill="#FFD9DC"/>
  <!-- measurement marks -->
  <g stroke="#9CA3AF" stroke-width="5" stroke-linecap="round">
    <line x1="540" y1="330" x2="580" y2="330"/>
    <line x1="540" y1="370" x2="580" y2="370"/>
    <line x1="540" y1="410" x2="580" y2="410"/>
    <line x1="540" y1="450" x2="580" y2="450"/>
  </g>
  <!-- nipple -->
  <path d="M560 170 C560 120 580 100 600 80 C620 100 640 120 640 170 Z" fill="#FF8A94"/>
  <rect x="548" y="150" width="104" height="34" rx="14" fill="#FF4757"/>
  <!-- labels -->
  <text x="760" y="300" font-family="sans-serif" font-size="64" font-weight="bold" fill="#1F2937">120ml</text>
  <text x="760" y="365" font-family="sans-serif" font-size="40" fill="#6B7280">우리 아기 한 번 분유량</text>
  <text x="760" y="425" font-family="sans-serif" font-size="40" fill="#6B7280">월령에 맞춰 확인하세요</text>
  <circle cx="730" cy="280" r="12" fill="#FF4757"/>
</svg>
