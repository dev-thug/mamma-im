<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="웃는 얼굴의 귀여운 젖병 일러스트">
  <rect width="1200" height="630" rx="32" fill="#FFF1F2"/>
  <!-- polka dots -->
  <g fill="#FBD9DD">
    <circle cx="120" cy="100" r="26"/>
    <circle cx="220" cy="540" r="18"/>
    <circle cx="1080" cy="120" r="22"/>
    <circle cx="1010" cy="530" r="30"/>
    <circle cx="880" cy="80" r="14"/>
    <circle cx="90" cy="360" r="14"/>
  </g>
  <!-- sparkles -->
  <g fill="#FFB3BA">
    <path d="M240 150 c2 10 6 14 16 16 c-10 2 -14 6 -16 16 c-2 -10 -6 -14 -16 -16 c10 -2 14 -6 16 -16z"/>
    <path d="M660 120 c2 10 6 14 16 16 c-10 2 -14 6 -16 16 c-2 -10 -6 -14 -16 -16 c10 -2 14 -6 16 -16z"/>
    <path d="M250 470 c1.5 8 5 11 13 12.5 c-8 1.5 -11.5 4.5 -13 12.5 c-1.5 -8 -5 -11 -13 -12.5 c8 -1.5 11.5 -4.5 13 -12.5z"/>
    <path d="M700 500 c1.5 8 5 11 13 12.5 c-8 1.5 -11.5 4.5 -13 12.5 c-1.5 -8 -5 -11 -13 -12.5 c8 -1.5 11.5 -4.5 13 -12.5z"/>
  </g>
  <!-- hearts -->
  <g fill="#FFC9CE">
    <path d="M150 250 c-8 -12 -28 -8 -28 6 c0 12 16 20 28 28 c12 -8 28 -16 28 -28 c0 -14 -20 -18 -28 -6z"/>
    <path d="M1140 528 c-8 -12 -28 -8 -28 6 c0 12 16 20 28 28 c12 -8 28 -16 28 -28 c0 -14 -20 -18 -28 -6z"/>
  </g>

  <!-- ground shadow -->
  <ellipse cx="430" cy="540" rx="150" ry="20" fill="#F3C1C6" opacity="0.7"/>

  <!-- arms -->
  <path d="M322 385 Q285 395 278 428" stroke="#FF8A94" stroke-width="20" stroke-linecap="round" fill="none"/>
  <path d="M528 385 Q565 395 572 428" stroke="#FF8A94" stroke-width="20" stroke-linecap="round" fill="none"/>

  <!-- nipple -->
  <path d="M393 152 C393 112 407 94 425 74 C443 94 457 112 457 152 Z" fill="#FFB3BA"/>

  <!-- cap with stripes -->
  <rect x="346" y="148" width="158" height="66" rx="26" fill="#FF6B7A"/>
  <rect x="358" y="164" width="134" height="12" rx="6" fill="#FFFFFF" opacity="0.9"/>
  <rect x="358" y="186" width="134" height="12" rx="6" fill="#FFFFFF" opacity="0.9"/>

  <!-- bottle body -->
  <rect x="320" y="208" width="210" height="312" rx="78" fill="#FFFFFF" stroke="#FF6B7A" stroke-width="10"/>
  <!-- milk with wavy top -->
  <rect x="342" y="348" width="166" height="138" rx="42" fill="#FFE3D3"/>
  <ellipse cx="425" cy="348" rx="83" ry="17" fill="#FFE3D3"/>
  <!-- measurement marks -->
  <g stroke="#E8A2AB" stroke-width="6" stroke-linecap="round">
    <line x1="352" y1="372" x2="374" y2="372"/>
    <line x1="352" y1="394" x2="374" y2="394"/>
    <line x1="352" y1="416" x2="374" y2="416"/>
  </g>
  <!-- happy face -->
  <g stroke="#6B3F3F" stroke-width="8" stroke-linecap="round" fill="none">
    <path d="M382 428 Q393 416 404 428"/>
    <path d="M446 428 Q457 416 468 428"/>
    <path d="M411 452 Q425 464 439 452"/>
  </g>
  <ellipse cx="372" cy="448" rx="15" ry="9" fill="#FF9AA5" opacity="0.85"/>
  <ellipse cx="478" cy="448" rx="15" ry="9" fill="#FF9AA5" opacity="0.85"/>

  <!-- little milk-drop buddy -->
  <path d="M628 392 C646 420 656 436 656 454 A28 28 0 1 1 600 454 C600 436 610 420 628 392 Z" fill="#FFD9DC" stroke="#FF8A94" stroke-width="6"/>
  <circle cx="618" cy="454" r="4.5" fill="#6B3F3F"/>
  <circle cx="638" cy="454" r="4.5" fill="#6B3F3F"/>
  <path d="M620 463 Q628 469 636 463" stroke="#6B3F3F" stroke-width="4" stroke-linecap="round" fill="none"/>
  <ellipse cx="611" cy="461" rx="6" ry="4" fill="#FF9AA5"/>
  <ellipse cx="645" cy="461" rx="6" ry="4" fill="#FF9AA5"/>

  <!-- labels -->
  <text x="760" y="300" font-family="sans-serif" font-size="72" font-weight="bold" fill="#1F2937">120ml</text>
  <text x="760" y="365" font-family="sans-serif" font-size="40" fill="#6B7280">우리 아기 한 번 분유량</text>
  <text x="760" y="425" font-family="sans-serif" font-size="40" fill="#6B7280">월령에 맞춰 확인하세요</text>
  <path d="M724 268 c-6 -9 -21 -6 -21 4.5 c0 9 12 15 21 21 c9 -6 21 -12 21 -21 c0 -10.5 -15 -13.5 -21 -4.5z" fill="#FF6B7A"/>
</svg>
